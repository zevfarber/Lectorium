name: Archive Beowulf source

# Brings an authentic Klaeber-1922 Beowulf text into the repo as
# sources/beowulf-fitt-NN-source.json, so an unattended Cowork firing can draft the
# poem with nothing but `git fetch`.
#
# Why it lives here rather than in the Cowork sandbox: measured 2026-08-20, the
# sandbox reaches nothing but GitHub - archive.org, Wikisource, Gutenberg and
# heorot.dk all return 000, and `git push` (receive-pack) is refused with 403. A
# runner has ordinary internet, so the fetch belongs here, exactly as it does for
# the KHM archiver.
#
# THE BAKE-OFF RUNS FIRST AND ALWAYS. Klaeber prints macrons and þ ð æ, which is
# precisely what 1922-typeface OCR destroys, and a silently dropped macron is a
# corrupted reader text no downstream gate would catch. So every run scores each
# candidate witness against the 136 hand-verified lines in
# .github/fixtures/beowulf-53-188-klaeber1922.txt - already published as fitts I
# and II - and NOTHING is archived unless a Klaeber witness reproduces all 136
# character-for-character. A negative result is a legitimate outcome, written to
# .github/witness-report.json and to the job summary; it does not fail the job,
# because "no adequate machine-readable Klaeber exists" is a finding, not a bug.
#
# ---------------------------------------------------------------------------
# ADDED 2026-08-21: THE VISION WITNESS
# ---------------------------------------------------------------------------
# The 2026-08-20 bake-off refused all five witnesses. Re-reading that report
# showed every one of them was a pre-existing TEXT DUMP - and a text dump cannot
# contain a macron whose OCR never recorded. archive.org holds the scans of
# the book itself, so .github/scripts/vision_klaeber.py reads the PAGE IMAGES
# with a vision model instead.
#
# It gets no special dispensation. It is scored by the same scorer against the
# same gold, and must additionally clear two controls the older witnesses never
# faced: two independent transcription passes of every page must agree
# character-for-character, and lines 1-52 concatenated must match the published
# prologue exactly (which is how the poem's other two circumflexes get tested at
# all). Perseus is demoted to a flags-only disagreement detector and never
# contributes a character.
#
# COST. The probe transcribes only the leaves carrying lines 1-188 - about 14
# leaves, two passes each - and is the cheap decisive test: if the model cannot
# reproduce text we have already verified by hand, nothing else matters and we
# have spent cents finding out. Only `mode: transcribe` reads the whole poem.
# Transcriptions are cached in .github/vision-cache/ and committed, so the full
# run is paid for once and stays auditable afterwards.
#
# Self-retrigger is prevented the three ways archive.yml uses: the commit touches
# only sources/** and .github/witness-report.json (audio.yml filters root-level
# *.json, this workflow filters its own script/fixture), commits made with the
# built-in GITHUB_TOKEN start no further runs, and the commit carries [skip ci].

on:
  # Pushing a new version of the archiver runs it immediately - the same
  # one-step property the KHM archiver has, so a publish IS the trigger.
  push:
    branches: [main]
    paths:
      - '.github/scripts/archive_beowulf.py'
      - '.github/scripts/vision_klaeber.py'
      - '.github/workflows/archive-beowulf.yml'
      - '.github/fixtures/beowulf-53-188-klaeber1922.txt'
  workflow_dispatch:
    inputs:
      mode:
        description: '"bakeoff" (score witnesses, write nothing) · "probe" (vision-read the gold pages only) · "transcribe" (vision-read the whole poem) · "archive" (emit all 44 source files)'
        required: false
        default: 'probe'

permissions:
  contents: write

concurrency:
  group: archive-beowulf
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Offline. Proves the fitt table sums to 3,182, the gold transcript is
      # intact, and - the part that matters - that the scorer CATCHES injected
      # defects: macrons stripped, thorn spelled th, a line dropped, a stripped
      # circumflex in the prologue. A gate that has only ever said "pass" has
      # not been shown to test anything.
      - name: Selftest, archiver (offline, fatal)
        run: python .github/scripts/archive_beowulf.py --selftest

      # Same discipline for the vision path, and it needs no API key to run:
      # nine injected defects, including a hallucinated line that two passes
      # render differently and a model that translates instead of transcribing.
      - name: Selftest, vision witness (offline, no API key, fatal)
        run: python .github/scripts/vision_klaeber.py --selftest

      - name: Check for the API key
        id: key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "present=false" >> $GITHUB_OUTPUT
            {
              echo "### Vision witness skipped"
              echo ""
              echo "No \`ANTHROPIC_API_KEY\` repository secret is set, so the page"
              echo "scans were not read. Everything else in this run is unaffected."
              echo ""
              echo "To enable it: **Settings → Secrets and variables → Actions →"
              echo "New repository secret**, named \`ANTHROPIC_API_KEY\`."
            } >> $GITHUB_STEP_SUMMARY
          else
            echo "present=true" >> $GITHUB_OUTPUT
          fi

      # The cheap decisive test. Reads only the leaves carrying lines 1-188 and
      # scores them against text we already verified by hand. Runs by default,
      # including on a plain push, because it costs cents and a publish should
      # be the trigger.
      - name: Vision probe (gold pages only)
        if: ${{ steps.key.outputs.present == 'true' && github.event.inputs.mode != 'bakeoff' && github.event.inputs.mode != 'archive' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VISION_MODEL: ${{ vars.VISION_MODEL }}
        run: python .github/scripts/vision_klaeber.py --probe

      # The whole poem. Manual only - this is the one step that costs real
      # money, and it refuses to run at all unless the probe passed.
      - name: Vision transcribe (whole poem)
        if: ${{ steps.key.outputs.present == 'true' && github.event.inputs.mode == 'transcribe' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VISION_MODEL: ${{ vars.VISION_MODEL }}
        run: python .github/scripts/vision_klaeber.py --transcribe

      - name: Witness bake-off
        run: python .github/scripts/archive_beowulf.py --bakeoff

      - name: Archive (only if a Klaeber witness passed every control)
        if: ${{ github.event.inputs.mode == 'archive' }}
        run: python .github/scripts/archive_beowulf.py --archive

      - name: Commit
        run: |
          set -eo pipefail
          git config user.name  'lectorium-archiver'
          git config user.email 'actions@github.com'
          git add sources .github/witness-report.json .github/vision-probe.json .github/vision-cache 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          N=$(git diff --cached --name-only | wc -l | tr -d ' ')
          git commit -m "Beowulf archiver ($N file(s)) [skip ci]"
          git pull --rebase origin main
          git push
          echo "Pushed $N file(s)."

      - name: Verdict
        if: always()
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f .github/witness-report.json ]; then
            python - <<'PY' >> $GITHUB_STEP_SUMMARY
          import json, os
          r = json.load(open('.github/witness-report.json'))
          print("**Bake-off verdict:** " + r.get("verdict", "?"))
          if os.path.exists('.github/vision-probe.json'):
              v = json.load(open('.github/vision-probe.json'))
              print("")
              print("**Vision verdict:** " + v.get("verdict", "?"))
          PY
          fi
