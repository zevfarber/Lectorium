name: Build audio

# Synthesizes missing per-sentence TTS clips and karaoke word-timings for any
# audio-bearing story JSON pushed to main, then commits audio/<id>/*.mp3 +
# align.json back to main. Runs on a GitHub-hosted runner because the Cowork
# sandbox cannot reach Google TTS; the runner has open internet.
#
# Self-retrigger is prevented three ways: (1) the path filter is root-level
# *.json only, so the audio/** commit does not match; (2) commits made with the
# built-in GITHUB_TOKEN do not trigger further workflow runs; (3) [skip ci] on
# the audio commit.

on:
  push:
    branches: [main]
    paths:
      - '*.json'
      - '.github/scripts/**'
  workflow_dispatch:
    inputs:
      id:
        description: 'Story id (or <id>.json) to build audio for'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: build-audio
  cancel-in-progress: false

jobs:
  audio:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system + Python dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng espeak libespeak-dev libsndfile1 ffmpeg
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet librosa soundfile numpy

      - name: Pick target stories
        id: targets
        env:
          DISPATCH_ID: ${{ github.event.inputs.id }}
          BEFORE_SHA: ${{ github.event.before }}
        run: python3 .github/scripts/pick_targets.py

      - name: Synthesize + align
        if: steps.targets.outputs.ids != ''
        env:
          GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
        run: |
          set -e
          for id in ${{ steps.targets.outputs.ids }}; do
            echo "::group::build audio for $id"
            python3 .github/scripts/build_audio.py "$id"
            echo "::endgroup::"
          done

      # THE RACE THIS STEP LOST ON 17 AUG 2026, AND WHY IT NOW REBASES.
      # Run #89 synthesized audio for all 47 tales of the P5-P10 landing — 2h 3m
      # of paid Google TTS — committed 3,480 files locally, and then exited 1 at
      # `git push`. Synthesis takes hours, and main moves while it runs:
      # auto-publish pushes every 5 minutes, and that day two archiver commits
      # landed as well. A bare push against a branch that has moved is rejected
      # non-fast-forward, and the entire run's work is discarded — the clips exist
      # only on a runner that is about to be destroyed.
      #
      # Rebasing is safe here specifically because this commit touches ONLY
      # audio/**: story files, the manifest and the glossary are never staged by
      # this job, so there is nothing for a concurrent auto-publish to conflict
      # with. Retry a few times, because main can move again between the rebase
      # and the push. Never force — a rebase that genuinely fails is a real
      # problem and must stop the run rather than overwrite someone's push.
      - name: Commit audio back to main
        if: steps.targets.outputs.ids != ''
        run: |
          git config user.name "lectorium-audio-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add audio/
          if git diff --cached --quiet; then
            echo "No audio changes to commit."
            exit 0
          fi
          git commit -m "Audio: build clips + align.json for ${{ steps.targets.outputs.ids }} [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected on attempt $attempt — main moved under this run; rebasing onto it"
            if ! git pull --rebase --autostash origin main; then
              echo "REBASE FAILED — refusing to force. The audio is committed locally on the"
              echo "runner and will be lost; re-run this workflow once main is settled."
              exit 1
            fi
            sleep $((attempt * 5))
          done
          echo "could not push after 5 attempts — main is moving faster than this job can land."
          exit 1
