name: Latin voices pilot

# Pilot only, 2026-10-04: Ovid Met. I.1-4 and Virgil Aen. I.1-4 in restored Classical Latin, read by
# several Google WaveNet voices from the same IPA pins, into audio-pilot/latin/. Dispatch only.

on:
  workflow_dispatch:
    inputs:
      voices:
        description: 'Google voices, space separated'
        required: true
        default: 'de-DE-Wavenet-B it-IT-Wavenet-C es-ES-Wavenet-B'

permissions:
  contents: write

jobs:
  latin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Synthesize
        env:
          GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
        run: python3 .github/scripts/latin_pilot.py ${{ github.event.inputs.voices }}
      - name: Commit
        run: |
          git config user.name "lectorium-audio-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add audio-pilot/
          git diff --cached --quiet && exit 0
          git commit -m "Latin voices pilot clips [skip ci]"
          for a in 1 2 3 4 5; do git push && exit 0; git pull --rebase origin main; sleep $((a*5)); done
          exit 1
