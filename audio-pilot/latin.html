<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Latin voices — pilot</title>
<style>
:root{--bg:#faf8f3;--fg:#222;--muted:#6b665c;--line:#e3ddd0;--accent:#7a5c2e}
@media (prefers-color-scheme:dark){:root{--bg:#1c1b19;--fg:#ece8df;--muted:#a39d90;--line:#35322c;--accent:#d2ac6a}}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.5 Georgia,serif}
main{max-width:760px;margin:0 auto;padding:24px 16px 60px}
h1{font-size:1.5rem;margin:0 0 4px}h2{font-size:1.1rem;margin:22px 0 4px}.sub{color:var(--muted);margin:0 0 12px}
.u{border-top:1px solid var(--line);padding:12px 0}.g{font-size:1.15rem}
.tr{color:var(--muted);font-size:.9rem;margin:2px 0 8px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row span{width:74px;color:var(--muted);font-size:.85rem}
audio{height:32px;max-width:100%;flex:1;min-width:200px}
</style></head><body><main>
<h1>Voices for Latin</h1>
<p class="sub">Restored Classical pronunciation, normal word stress, long vowels held long. Under each line: the long vowels marked, as the voice reads them. Each voice reads exactly the same sounds.</p>
<div id="list">Loading…</div>
</main><script>
const NAMES = {"de-DE-Wavenet-B":"German voice (same as the Greek)","it-IT-Wavenet-C":"Italian voice","es-ES-Wavenet-B":"Spanish voice"};
const TITLES = {ovid:"Ovid, Metamorphoses I.1–4", virgil:"Virgil, Aeneid I.1–4"};
const plain = s => s.normalize('NFD').replace(/̄/g,'').normalize('NFC');
(async () => {
  const p = await fetch('latin/pins.json').then(r=>r.json());
  const voices = await fetch('latin/voices.json').then(r=>r.json());
  const L = document.getElementById('list'); L.innerHTML = '';
  for (const [w, lines] of Object.entries(p.lines)) {
    const h = document.createElement('h2'); h.textContent = TITLES[w] || w; L.appendChild(h);
    lines.forEach((t, n) => {
      const d = document.createElement('div'); d.className = 'u';
      d.innerHTML = '<div class="g"></div><div class="tr"></div>' + voices.map((v, k) =>
        '<div class="row"><span>Voice ' + 'ABC'[k] + '</span><audio controls preload="none" src="latin/' + v + '/' + w + '-' + n + '.mp3" title="' + (NAMES[v]||v) + '"></audio></div>').join('');
      d.querySelector('.g').textContent = plain(t); d.querySelector('.tr').textContent = t;
      L.appendChild(d);
    });
  }
  const key = document.createElement('p'); key.className = 'sub';
  key.textContent = voices.map((v, k) => 'Voice ' + 'ABC'[k] + ': ' + (NAMES[v]||v)).join(' · ');
  L.appendChild(key);
})();
</script></body></html>
