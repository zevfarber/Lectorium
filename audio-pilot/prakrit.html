<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prakrit voices — pilot</title>
<style>
:root{--bg:#faf8f3;--fg:#222;--muted:#6b665c;--line:#e3ddd0;--accent:#7a5c2e}
@media (prefers-color-scheme:dark){:root{--bg:#1c1b19;--fg:#ece8df;--muted:#a39d90;--line:#35322c;--accent:#d2ac6a}}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.5 Georgia,serif}
main{max-width:760px;margin:0 auto;padding:24px 16px 60px}
h1{font-size:1.5rem;margin:0 0 4px}h2{font-size:1.1rem;margin:22px 0 4px}.sub{color:var(--muted);margin:0 0 12px}
.u{border-top:1px solid var(--line);padding:12px 0}.g{font-size:1.15rem}
.tr{color:var(--muted);font-size:.9rem;margin:2px 0 8px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row span{width:74px;color:var(--muted);font-size:.85rem}
audio{height:32px;max-width:100%;flex:1;min-width:200px}
</style></head><body><main>
<h1>Voices for Prakrit</h1>
<p class="sub">Four passages from the Kalpasūtra: the Namokkāra, its closing verse, the opening of §1, and the verse of the fourteen dreams. Google has no Prakrit voice, so each option borrows one. Option C is exactly how the Gita is voiced.</p>
<div id="key"></div>
<div id="list">Loading…</div>
</main><script>
const NOTES = {
 A: "Reads the Devanagari as Hindi would. For Sanskrit you found it changed the sound away from the spelling; Prakrit words mostly end in -ṃ, -e or -o, so the dropped final a matters less here.",
 B: "Reads the Devanagari as Marathi would.",
 C: "The Sanskrit voice: the same text changed letter for letter into Kannada script and read by the Kannada voice, every vowel kept."
};
const NAMES = {namokkara:"The Namokkāra", verse:"Its closing verse", s1:"§1, opening", dreams:"§4, the fourteen dreams"};
(async () => {
  const p = await fetch('prakrit/lines.json', {cache:'no-cache'}).then(r=>r.json());
  const voices = await fetch('prakrit/voices.json', {cache:'no-cache'}).then(r=>r.json());
  const K = document.getElementById('key');
  K.innerHTML = voices.map(v => '<p class="sub"><b>' + v.option + '</b> — ' + v.label + '. ' + (NOTES[v.option]||'') + '</p>').join('');
  const L = document.getElementById('list'); L.innerHTML = '';
  p.lines.forEach(ln => {
    const d = document.createElement('div'); d.className = 'u';
    d.innerHTML = '<div class="tr"></div><div class="g"></div><div class="tr"></div><div class="tr"></div>' + voices.map(v =>
      '<div class="row"><span>Option ' + v.option + '</span><audio controls preload="none" src="prakrit/' + v.option + '/' + ln.cite + '.mp3"></audio></div>').join('');
    const t = d.querySelectorAll('.tr'); t[0].textContent = NAMES[ln.cite] || ln.cite;
    d.querySelector('.g').textContent = ln.deva; t[1].textContent = ln.iast; t[2].textContent = ln.en;
    L.appendChild(d);
  });
})();
</script></body></html>
